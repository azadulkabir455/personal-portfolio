name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package build output
        run: |
          rm -rf .next/cache
          zip -qr deploy.zip .next public package.json pnpm-lock.yaml server.js next.config.ts

      - name: Upload package to cPanel via FTPS
        run: |
          curl --ftp-ssl -sS -T deploy.zip \
            "ftp://${{ secrets.FTP_HOST }}/deploy.zip" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"

      - name: Extract, sync dependencies and restart app
        run: |
          curl -sf -X POST "https://designwithfatema.me/api/deploy-webhook" \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
